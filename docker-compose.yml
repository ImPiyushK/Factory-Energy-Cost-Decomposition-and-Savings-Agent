services:
  api:
    build: .
    image: factory-energy-agent:latest
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data               # SQLite store + data packs live here (from host)
    # To use a hosted/local LLM, create .env from .env.example and add:
    #   env_file:
    #     - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets OLLAMA reach an Ollama daemon on the host
    healthcheck:
      test: ["CMD", "python", "-c",
             "import httpx; r = httpx.get('http://localhost:8000/health', timeout=5); exit(0 if r.status_code == 200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  ui:
    image: factory-energy-agent:latest
    build: .
    command: streamlit run src/ui/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_started
